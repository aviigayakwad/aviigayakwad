<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <title>Avinash Gayakwad | Links</title>
  <meta name="description" content="Avinash Gayakwad — Creating. Gaming. Exploring." />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{
      color:#fff;background:#050505;
      display:flex;justify-content:center;overflow-x:hidden;
    }
    body:before{
      content:"";position:fixed;inset:-20%;
      background:
        radial-gradient(circle at 50% 10%,rgba(255,0,45,.20),transparent 28%),
        radial-gradient(circle at 10% 90%,rgba(180,0,20,.10),transparent 25%);
      pointer-events:none;
    }
    .page{width:min(100%,520px);padding:42px 20px 32px;position:relative}
    .profile{text-align:center}
    .avatar{
      width:96px;height:96px;border-radius:50%;margin:0 auto 18px;
      display:grid;place-items:center;font-size:30px;font-weight:900;
      background:linear-gradient(145deg,#ff1f3d,#65000d);
      border:2px solid rgba(255,255,255,.15);
      box-shadow:0 0 0 6px rgba(255,0,45,.06),0 12px 40px rgba(255,0,45,.22);
    }
    h1{margin:0;font-size:27px;letter-spacing:.3px}
    .tag{margin:8px 0 0;color:#ff5369;font-weight:700}
    .about{
      margin:24px 0 20px;padding:22px 20px;border-radius:20px;
      background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
      backdrop-filter:blur(10px);line-height:1.55
    }
    .about strong{display:block;font-size:17px;margin-bottom:8px}
    .about p{margin:0;color:#c9c9c9;font-size:14px}
    .links{display:grid;gap:13px}
    .link{
      position:relative;display:flex;align-items:center;gap:14px;
      min-height:62px;padding:0 18px;border-radius:17px;
      color:#fff;text-decoration:none;font-weight:800;
      background:#111;border:1px solid rgba(255,255,255,.09);
      transition:.2s transform,.2s border-color,.2s background;
    }
    .link:hover{transform:translateY(-2px);border-color:rgba(255,50,75,.65);background:#171717}
    .icon{width:30px;text-align:center;font-size:22px}
    .name{flex:1}
    .arrow{color:#777;font-size:20px}
    footer{text-align:center;color:#666;font-size:12px;margin-top:27px}
    @media(max-width:420px){.page{padding-top:30px}h1{font-size:24px}}
  </style>
</head>
<body>
<main class="page">
  <section class="profile">
    <div class="avatar">AG</div>
    <h1>Avinash Gayakwad</h1>
    <div class="tag">Creating. Gaming. Exploring. 🚀</div>
  </section>

  <section class="about">
    <strong>Welcome To My Corner Of The Internet.</strong>
    <p>Follow Me On My Social Platforms And Stay Connected With Everything I Create.</p>
  </section>

  <section class="links">
    <a class="link" href="https://youtube.com/@aviigayakwad" target="_blank" rel="noopener">
      <span class="icon">▶️</span><span class="name">YouTube</span><span class="arrow">›</span>
    </a>
    <a class="link" href="https://www.facebook.com/aviiigayakwad" target="_blank" rel="noopener">
      <span class="icon">f</span><span class="name">Facebook</span><span class="arrow">›</span>
    </a>
    <a class="link" href="https://www.instagram.com/aviigayakwad" target="_blank" rel="noopener">
      <span class="icon">◎</span><span class="name">Instagram</span><span class="arrow">›</span>
    </a>
    <a class="link" href="https://x.com/aviigayakwad" target="_blank" rel="noopener">
      <span class="icon">𝕏</span><span class="name">X</span><span class="arrow">›</span>
    </a>
    <a class="link" href="https://www.threads.com/@aviigayakwad" target="_blank" rel="noopener">
      <span class="icon">@</span><span class="name">Threads</span><span class="arrow">›</span>
    </a>
  </section>

  <footer>© 2026 Avinash Gayakwad</footer>
</main>
</body>
</html>
